name: Pull request verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    # `main`: every merge SHA gets a bound `verify` result for kanmer-verify,
    # and `regate` re-judges open PRs whose base just moved. A `push:` trigger
    # for `kanmer-board` would never fire from here: GitHub runs push workflows
    # from the pushed ref's tree, and the board branch carries only .kanmer.
    # `.github/workflows/board-regate.yml` is the file an operator copies onto
    # the board branch; it dispatches this workflow on `main`.
    branches: [main]
  # Manual re-gate, and the target of board-regate.yml's dispatch.
  workflow_dispatch:

permissions:
  contents: read

# One live run per PR (or per ref for a dispatch): a newer head or a burst of
# board-push dispatches cancels the superseded run instead of queueing behind
# it. A push to `main` is never cancelled — its `verify` result is the bound
# post-merge receipt kanmer-verify consumes, and it must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    shell: bash

jobs:
  # Edited PR events skip the rail; a push runs it only for main so every
  # merge SHA carries a bound verify result (the board-branch push does not).
  # A `workflow_dispatch` never runs it (CORE-139): the old condition tested
  # only `github.ref`, which is `refs/heads/main` on a dispatch too, so every
  # board push was re-proving an already-proven commit.
  verify:
    name: verify
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'edited')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the authoritative verification rail
        run: npm ci && npm run verify

  kanmer-gate:
    name: kanmer-gate
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the read-only core
        run: npm run build:core

      - name: Fetch the exact PR ancestry
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$PR_HEAD_SHA" "$PR_BASE_SHA"

      - name: Fetch the board worktree
        env:
          # Repository administrators must set this variable to the destination
          # before retargeting the protected board branch. The default preserves
          # existing repos until that explicit handoff is complete. The GUI
          # retains the old custom remote ref until this hosted handoff too.
          KANMER_BOARD_BRANCH: ${{ vars.KANMER_BOARD_BRANCH || 'kanmer-board' }}
        run: |
          test -n "$KANMER_BOARD_BRANCH"
          git fetch --no-tags origin "refs/heads/$KANMER_BOARD_BRANCH:refs/remotes/origin/$KANMER_BOARD_BRANCH"
          git worktree add "$RUNNER_TEMP/kanmer-board" "refs/remotes/origin/$KANMER_BOARD_BRANCH"

      - name: Assert fetched board is separate from the pull request checkout
        run: |
          board_path="$(cd "$RUNNER_TEMP/kanmer-board" && pwd -P)"
          workspace_path="$(pwd -P)"
          test "$board_path" != "$workspace_path"

      - name: Run the phase-2 merge gate
        env:
          # Repository variable. Unset/false keeps the compatibility-period
          # warnings (missing/stale attestation, unreachable commits, board
          # sync); `1`/`true` promotes them to blocking errors (CORE-123).
          KANMER_GATE_STRICT: ${{ vars.KANMER_GATE_STRICT || '' }}
        run: node packages/mcp-server/src/check-pr.mjs --board "$RUNNER_TEMP/kanmer-board" --event "$GITHUB_EVENT_PATH"

  # Re-run the kanmer-gate job of the latest pull_request run for every open PR
  # into main. Runs on workflow_dispatch (by hand, or dispatched from the board
  # branch by board-regate.yml once an operator has installed it there) and on
  # every push to main (the PR base moved). Only that job is re-run, not the
  # full verify rail.
  regate:
    name: regate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run kanmer-gate for every open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: pr.yml
        run: |
          set -u
          heads="$(gh pr list --base main --state open --limit 100 --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"')"
          if [ -z "$heads" ]; then
            echo "no open pull requests into main"
            exit 0
          fi
          while read -r number sha; do
            [ -n "$sha" ] || continue
            run_id="$(gh run list --workflow "$WORKFLOW_FILE" --event pull_request --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -z "$run_id" ]; then
              echo "PR #$number ($sha): no pull_request run found; skipping"
              continue
            fi
            job_id="$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select(.name == "kanmer-gate") | .id' | head -n 1)"
            if [ -z "$job_id" ]; then
              echo "PR #$number ($sha): run $run_id has no kanmer-gate job; skipping"
              continue
            fi
            if gh run rerun "$run_id" --job "$job_id"; then
              echo "PR #$number ($sha): re-ran kanmer-gate job $job_id of run $run_id"
            else
              # A run still in progress cannot be re-run; it will judge the new tip anyway.
              echo "PR #$number ($sha): could not re-run job $job_id of run $run_id (in progress or not permitted); skipping"
            fi
          done <<< "$heads"
