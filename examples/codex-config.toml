# Example portable Codex MCP registration for Kanmer Connect.
#
# The recommended route is the Kanmer plugin for workflow skills plus Connect
# for the board MCP registration. Do not combine this project registration with
# a second manual/plugin MCP registration for the same server.
#
# Prerequisites:
# - Windows Kanmer installed through the supported per-user NSIS installer.
# - The installer-owned launcher exists at
#   %LOCALAPPDATA%\Kanmer\bin\kanmer-mcp.cmd and `--probe` succeeds.
# - The project is trusted by Codex so it loads project-scoped config.
# - Run Connect again after repair/reinstall; it replaces only this entry.
#
# The launcher expands LOCALAPPDATA on the destination machine and preserves
# Codex's project working directory. No username, drive, install path, board
# path, source checkout, Node path or root flag belongs in this registration.
# GUI-101/GUI-102 own packaged update and real-host machine-move proof before
# this ignored file becomes a shareable repository configuration.

[mcp_servers.kanmer]
command = "powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& (Join-Path $env:LOCALAPPDATA 'Kanmer\\bin\\kanmer-mcp.cmd')"]
