appId: com.kanmer.app
productName: Kanmer
# Electron is hoisted to the workspace root, so pin the version explicitly.
electronVersion: 31.7.7
directories:
  output: release
  buildResources: build

# Everything the app needs at runtime is bundled into out/** by electron-vite,
# so we ship only that plus package.json (for the main entry + version).
files:
  - out/**/*
  - package.json

# The NSIS hook copies this static source to the stable, installer-owned
# per-user launcher path. It is deliberately an install-root file, not an
# application resource: upgrades replace resources, while registrations keep
# pointing at %LOCALAPPDATA%\\Kanmer\\bin\\kanmer-mcp.cmd.
extraFiles:
  - from: build/kanmer-mcp.cmd
    to: kanmer-mcp.cmd

# The self-contained MCP server bundle, placed at resources/mcp/kanmer-mcp.cjs
# inside the install. The app launches it via ELECTRON_RUN_AS_NODE.
extraResources:
  - from: ../../packages/mcp-server/dist/standalone/kanmer-mcp.cjs
    to: mcp/kanmer-mcp.cjs
  - from: ../../packages/mcp-server/dist/standalone/remote-cli.cjs
    to: mcp/remote-cli.cjs
  - from: ../../packages/mcp-server/dist/standalone/doctor-cli.cjs
    to: mcp/doctor-cli.cjs
  # The plugin itself: skills, and the tree each marketplace manifest below
  # points at as `./plugins/kanmer`.
  - from: ../../plugins/kanmer
    to: plugins/kanmer
  # The two marketplace MANIFESTS, without which the line above is not a
  # marketplace source at all — only a directory of files no host can be told
  # about. `plugin marketplace add <dir>` looks for one of these inside <dir>
  # and exits 1 when it is absent, so shipping the plugin alone meant the
  # packaged app had no local marketplace, for every release, while the comment
  # here said it did (MCP-013). The v2 plan asked for both
  # (docs/plans/kanmer-v2/phase-6-agents-connect/plan.md:30); only the plugin
  # directory landed.
  #
  # They keep their repo-relative paths so `resources/` reproduces the repo-root
  # layout exactly: each manifest's `./plugins/kanmer` then resolves to the entry
  # above, and connect.ts's marketplaceRoot() — pluginRoot() minus two segments —
  # is correct in the packaged app for the same reason it is correct in dev.
  # Two different files because two different schemas: Claude reads the first
  # (marketplace `kanmer`), codex the second (marketplace `kanmer-plugins`).
  - from: ../../.claude-plugin/marketplace.json
    to: .claude-plugin/marketplace.json
  - from: ../../.agents/plugins/marketplace.json
    to: .agents/plugins/marketplace.json

# Auto-update feed. owner/repo are explicit because neither package.json has a
# `repository` field, so electron-builder's auto-detection has nothing to read.
# releaseType MUST NOT be the default `draft`: GitHubProvider reads
# releases.atom and /releases/latest, and neither lists drafts — a draft release
# is invisible to every installed client, silently.
publish:
  - provider: github
    owner: collisionengineers
    repo: kanmer
    releaseType: release

win:
  artifactName: "${productName}-Setup-${version}.${ext}"
  icon: build/icon.ico
  target:
    - nsis

nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kanmer
