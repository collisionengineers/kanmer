<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kanmer — Interactive UI Mockup</title>
  <style>
    :root{--bg:#0f1115;--bg-2:#161a21;--bg-3:#1d222b;--line:#262c37;--line-2:#333b48;--text:#e6e9ef;--muted:#8b93a3;--accent:#5b8cff;--accent-dim:#2b3a63;--danger:#ff6b6b;--warn:#ffcf7a;--success:#5bd1c9;--radius:8px;color-scheme:dark}
    :root[data-theme="light"]{--bg:#f6f7f9;--bg-2:#fff;--bg-3:#eef1f5;--line:#e2e6ec;--line-2:#cdd3dc;--text:#1b2028;--muted:#66707f;--accent:#2f6bff;--accent-dim:#dbe6ff;--danger:#d92d20;--warn:#a05e03;--success:#14806b;color-scheme:light}
    *{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:var(--bg-3);border:1px solid var(--line-2);border-radius:6px;padding:6px 12px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button.ghost{background:transparent}.sm{padding:4px 10px!important}.xs{padding:2px 8px!important;font-size:12px}.danger{color:var(--danger)!important}.app{height:100%;display:flex;flex-direction:column}.tab-strip{display:flex;gap:2px;padding:4px 8px 0;background:var(--bg-2);border-bottom:1px solid var(--line);overflow-x:auto;min-height:34px}.proj-tab{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;max-width:220px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;color:var(--muted);cursor:pointer}.proj-tab.active{background:var(--bg);color:var(--text);border-color:var(--line)}.proj-dot{width:7px;height:7px;background:var(--danger);border-radius:50%}.proj-close{border:0;background:none;padding:0 2px;opacity:.5}.proj-new{border:0;background:none;font-size:16px;padding:0 8px;color:var(--muted)}.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg-2)}.brand{font-weight:700;letter-spacing:-.3px;padding-right:6px}.tabs{display:flex;gap:4px}.tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:5px 12px}.tab.active{color:var(--text);background:var(--bg-3);border-color:var(--line-2)}.count{margin-left:6px;font-size:11px;color:var(--muted)}.spacer{flex:1}.bell{position:relative}.bell-dot{position:absolute;right:5px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--danger)}.filterbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.filterbar input,.filterbar select,input,select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px}.filterbar input{width:240px}.filterbar select{padding:5px 8px}.demo-banner{display:flex;gap:8px;align-items:center;padding:5px 12px;background:#14202a;border-bottom:1px solid #1f3543;color:var(--accent)}.main{flex:1;display:flex;min-height:0}.content{flex:1;overflow:auto;padding:14px;position:relative}.board{display:grid;grid-template-rows:auto 1fr;gap:8px;min-height:100%;min-width:1080px}.col-head{position:sticky;top:-14px;z-index:2;display:flex;justify-content:space-between;padding:4px 8px;background:var(--bg);font-weight:600;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px}.cell{min-height:100%;border-top:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:6px}.cell.dragover{border:1px dashed var(--accent);background:var(--accent-dim)}.area-group{display:flex;flex-direction:column;gap:6px}.area-head{display:flex;align-items:center;gap:6px;padding:2px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}.area-dot{width:8px;height:8px;border-radius:2px}.card{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:8px 10px;cursor:pointer;position:relative}.card:hover,.card.selected{border-color:var(--accent)}.card.selected{box-shadow:0 0 0 1px var(--accent)}.compact .cell{gap:4px}.compact .card{padding:4px 8px}.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}.card-id{font:11px ui-monospace,monospace;color:var(--muted)}.card-title{font-weight:500}.card-labels{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.card-assignee{font-size:11px;color:var(--muted);margin-top:6px}.chip{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--muted)}.chip.taken{color:var(--accent)}.chip.blocked{color:var(--danger)}.chip.pr{background:color-mix(in srgb,var(--accent) 16%,transparent)}.chip.group{cursor:pointer;background:var(--accent-dim);color:var(--text)}.list{max-width:900px;display:flex;flex-direction:column;gap:4px}.list-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg-2);border:1px solid var(--line);padding:9px 12px}.list-id{font:11px ui-monospace,monospace;color:var(--muted);min-width:72px}.list-title{flex:1;font-weight:500}.standup{max-width:760px;padding:6px 8px}.standup h2{margin:0}.standup h3{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}.linklike{border:0;background:none;color:var(--accent);padding:0}.drawer{width:340px;border-left:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;overflow:hidden}.drawer-head{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.activity-list{list-style:none;margin:0;padding:0;overflow:auto}.activity-row{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px}.activity-row:hover{background:var(--bg-3)}.muted,.activity-meta{font-size:11px;color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.backdrop{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center}.modal{width:760px;max-width:94vw;max-height:90vh;background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 60px #0008}.modal.wide{width:min(900px,94vw);height:min(650px,90vh)}.modal-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:16px}.modal-body{padding:16px;overflow:auto}.editor-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px}.editor-id{font:600 12px ui-monospace,monospace;color:var(--accent)}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field>span{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}.field-row{display:flex;gap:10px}.field-row .field{flex:1}input,select,textarea{width:100%}textarea{min-height:200px;resize:vertical;font-family:ui-monospace,monospace;line-height:1.6}.readiness{margin-bottom:12px;padding:8px 10px;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius)}.gate{display:flex;gap:10px;padding:2px 0}.gate-label{min-width:11em;color:var(--muted)}.req.met{color:var(--muted)}.req.missing{color:var(--warn)}.doc-view{min-height:280px;padding:12px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;white-space:pre-wrap}.checkitem{display:flex;gap:8px;padding:5px}.checkitem input{width:auto}.done{text-decoration:line-through;color:var(--muted)}.modal-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.settings-shell{display:flex;flex:1;min-height:0}.settings-rail{width:160px;padding:10px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}.settings-rail button{text-align:left}.settings-pane{flex:1;padding:16px;overflow:auto}.setting-section{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}.setting-section h3{font-size:12px;text-transform:uppercase;color:var(--muted)}.color-row{display:flex;align-items:center;gap:8px;margin:6px 0}.color-row input{width:32px;height:28px;padding:0}.palette{width:520px;align-self:flex-start;margin-top:12vh}.palette input{border:0;border-radius:0;background:var(--bg-3);font-size:15px;padding:12px 14px}.palette-list{list-style:none;margin:0;padding:6px;max-height:360px;overflow:auto}.palette-list li{padding:7px 10px;border-radius:5px;cursor:pointer}.palette-list li:hover{background:var(--bg-3)}.ctx{position:fixed;z-index:60;min-width:190px;padding:4px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:0 8px 24px #0008}.ctx button{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;text-align:left}.ctx button:hover{background:var(--accent-dim)}.ctx hr{border:0;border-top:1px solid var(--line);margin:4px}.toast-stack{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}.toast{background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--radius);padding:10px 14px;box-shadow:0 6px 18px #0008}.kbd{font:10px ui-monospace,monospace;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(max-width:900px){.topbar{gap:4px}.topbar>.ghost{padding:5px}.brand{display:none}.filterbar input{width:160px}.drawer{position:absolute;right:0;top:0;bottom:0;z-index:5;box-shadow:-8px 0 24px #0008}.field-row{flex-direction:column;gap:0}}
  </style>
</head>
<body><div id="app"></div><div id="overlay"></div><div class="toast-stack" id="toasts"></div>
<script>
(()=>{
  const STAGES=[['backlog','Backlog'],['preparing','Preparing'],['implementing','Implementing'],['review','Review'],['verifying','Verifying'],['done','Done']];
  const AREAS={core:['Core','#5b8cff'],mcp:['MCP Server','#5bd1c9'],gui:['GUI','#ffcf7a'],skills:['Skills','#9fe870'],docs:['Docs','#c8a2ff']};
  const seed=()=>({projects:[
    {id:'atlas',name:'atlas-platform',path:'C:\\Projects\\atlas-platform',unread:0,tickets:[
      T('GUI-151','Create a fully interactive standalone Kanmer UI mockup','implementing','gui','codex',['mockup','ui'],'HZN-008',{taken:1,pr:null,docs:docs('GUI-151',1)}),
      T('CORE-141','Make board writes resilient to interrupted renames','backlog','core','', ['reliability'],'EPIC-014',{blocked:1}),
      T('MCP-061','Expose project health through the status resource','backlog','mcp','mina',['mcp','health'],null,{}),
      T('DOC-024','Document batch workspace recovery','preparing','docs','sam',['docs'],'HZN-008',{docs:docs('DOC-024',0)}),
      T('GUI-154','Add timeline filtering to the activity drawer','preparing','gui','alex',['activity','ux'],null,{}),
      T('CORE-143','Compile bounded file scopes for execution steps','implementing','core','claude-code',['autonomy'],'EPIC-014',{taken:1,docs:docs('CORE-143',2)}),
      T('SKILL-043','Teach verify to preserve failed attempts','implementing','skills','codex',['verification'],null,{taken:1}),
      T('GUI-149','Add registered project endpoint management','review','gui','kt',['projects','registry'],'HZN-008',{pr:318,docs:docs('GUI-149',3)}),
      T('MCP-059','Bind remote requests to logical project identity','review','mcp','mina',['security','remote'],'EPIC-014',{pr:322,blocked:1}),
      T('CORE-139','Record release candidate lineage','verifying','core','claude-code',['release'],'HZN-008',{pr:316,docs:docs('CORE-139',4)}),
      T('GUI-147','Show board worktree health without blocking use','done','gui','kt',['git','health'],null,{pr:311,docs:docs('GUI-147',5)}),
      T('MCP-056','Resolve endpoint registries outside project boards','done','mcp','claude-code',['discovery'],null,{pr:315}),
      T('CORE-137','Publish and validate v0.4.1','done','core','kt',['release','v0.4.1'],'HZN-008',{pr:319}),
      {...T('GUI-132','Retire the legacy priority filter','done','gui','sam',['cleanup'],null,{}),archived:true}
    ]},
    {id:'studio',name:'design-studio',path:'C:\\Projects\\design-studio',unread:3,tickets:[
      T('WEB-021','Refine the asset review board','backlog','gui','maya',['design'],null,{}),T('API-018','Stream render status updates','implementing','mcp','lee',['api'],null,{taken:1}),T('WEB-019','Ship the new project dashboard','review','gui','maya',['dashboard'],'EPIC-005',{pr:84}),T('OPS-007','Verify production image fonts','verifying','core','lee',['release'],null,{pr:86}),T('WEB-014','Add responsive canvas controls','done','gui','maya',['ui'],null,{pr:79})
    ]}
  ],activity:[['GUI-151','taken on GUI-151-interactive-kanmer-ui-mockup','codex','just now'],['GUI-149','moved implementing → review','kt','12m ago'],['CORE-139','proof.md written','claude-code','38m ago'],['MCP-059','blocks changed','mina','1h ago'],['CORE-143','plan.md written','claude-code','2h ago'],['GUI-147','moved verifying → done','kt','3h ago']],theme:'dark',density:'comfortable',view:'board',project:'atlas',filters:{q:'',area:'',assignee:'',label:'',group:''},selected:null,activityOpen:false,settingsOpen:false,paletteOpen:false,ctx:null,unread:2});
  function T(id,title,status,area,assignee,labels,group,opt){return{id,title,status,area,assignee,labels,groups:group?[group]:[],profile:id.startsWith('GUI')?'feature':'fix',body:`## What\n\n${title}.\n\n## Why\n\nThis fictional ticket demonstrates Kanmer's shared human and agent workflow.`,archived:false,...opt}}
  function docs(id,n){return{Ticket:`## What\n\n${id} is a seeded demonstration ticket.\n\n## Verification\n\n- [ ] Exercise this workflow in the mockup.`,Research:'# Research\n\nThe current renderer and governing documents were inspected.',Files:'# Files\n\n| Path | Purpose |\n|---|---|\n| `apps/gui/...` | Renderer surface |',Plan:`# Plan — ${id}\n\n1. Implement the bounded change.\n2. Validate the result.`,Checklist:`# Checklist\n\n- [x] Read the ticket\n- [${n>2?'x':' '}] Implement the change\n- [${n>3?'x':' '}] Run focused checks\n- [ ] Verify on merged main`,Proof:n>4?'# Proof\n\nPASS — visual and command checks completed.':''}}
  let state=seed();
  const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const project=()=>state.projects.find(p=>p.id===state.project), active=()=>project().tickets, ticket=id=>active().find(t=>t.id===id);
  function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;$('#toasts').append(e);setTimeout(()=>e.remove(),2200)}
  function record(id,text){state.activity.unshift([id,text,'you','just now']);state.unread++;}
  function filtered(){let a=active().filter(t=>!t.archived),f=state.filters,q=f.q.toLowerCase();return a.filter(t=>(!q||[t.id,t.title,t.assignee,...t.labels].join(' ').toLowerCase().includes(q))&&(!f.area||t.area===f.area)&&(!f.assignee||t.assignee===f.assignee)&&(!f.label||t.labels.includes(f.label))&&(!f.group||t.groups.includes(f.group)))}
  function render(){document.documentElement.dataset.theme=state.theme;const p=project(),all=active(),visible=filtered(),arch=all.filter(t=>t.archived);$('#app').innerHTML=`<div class="app">
    <div class="tab-strip" role="tablist">${state.projects.map(x=>`<div class="proj-tab ${x.id===p.id?'active':''}" data-project="${x.id}"><span>${esc(x.name)}</span>${x.id!==p.id&&x.unread?'<span class="proj-dot"></span>':''}<button class="proj-close" aria-label="Close project">×</button></div>`).join('')}<button class="proj-new" title="Open another project">+</button></div>
    <header class="topbar"><div class="brand">Kanmer</div><nav class="tabs"><button class="tab ${state.view==='board'?'active':''}" data-view="board">Board <span class="count">${all.filter(t=>!t.archived).length}</span></button><button class="tab ${state.view==='standup'?'active':''}" data-view="standup">Standup</button><button class="tab ${state.view==='archived'?'active':''}" data-view="archived">Archived <span class="count">${arch.length}</span></button></nav><div class="spacer"></div><button class="primary sm" id="new">+ New</button><button class="ghost bell" id="bell">🔔${state.unread?'<span class="bell-dot"></span>':''}</button><button class="ghost" id="settings">⚙ Settings</button><button class="ghost" title="${esc(p.path)}">${esc(p.name)}</button></header>
    <div class="demo-banner"><strong>Interactive mockup</strong><span>Fictional data · changes stay in this page</span><div class="spacer"></div><button class="ghost xs" id="reset">Reset demo</button></div>
    ${state.view==='board'?filterbar(visible):''}<div class="main"><section class="content">${state.view==='board'?board(visible):state.view==='standup'?standup(all):archiveView(arch)}</section>${state.activityOpen?activity():''}</div></div>`;
    bind(); renderOverlay();
  }
  function filterbar(){const all=active().filter(t=>!t.archived),opts=k=>[...new Set(all.flatMap(t=>k==='label'?t.labels:t[k]||[]).filter(Boolean))].sort();return`<div class="filterbar"><input id="search" type="search" placeholder="Search…  (Ctrl+F)" value="${esc(state.filters.q)}"><select data-filter="area"><option value="">All areas</option>${Object.entries(AREAS).map(([id,a])=>`<option value="${id}" ${state.filters.area===id?'selected':''}>${a[0]}</option>`).join('')}</select><select data-filter="group"><option value="">All groups</option>${opts('groups').map(x=>`<option ${state.filters.group===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="assignee"><option value="">All assignees</option>${opts('assignee').map(x=>`<option ${state.filters.assignee===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="label"><option value="">All labels</option>${opts('label').map(x=>`<option ${state.filters.label===x?'selected':''}>${x}</option>`).join('')}</select>${Object.values(state.filters).some(Boolean)?'<button class="ghost xs" id="clear">Clear</button>':''}</div>`}
  function board(items){const w=`repeat(${STAGES.length},minmax(170px,1fr))`;return`<div class="board ${state.density==='compact'?'compact':''}" style="grid-template-columns:${w}">${STAGES.map(s=>`<div class="col-head">${s[1]} <span>${items.filter(t=>t.status===s[0]).length}</span></div>`).join('')}${STAGES.map(s=>cell(s[0],items.filter(t=>t.status===s[0]))).join('')}</div>`}
  function cell(stage,items){const grouped={};items.forEach(t=>(grouped[t.area]??=[]).push(t));return`<div class="cell" data-stage="${stage}">${Object.entries(grouped).map(([area,list])=>`<div class="area-group"><div class="area-head"><span class="area-dot" style="background:${AREAS[area]?.[1]||'#888'}"></span>${AREAS[area]?.[0]||'No area'}</div>${list.map(card).join('')}</div>`).join('')}${items.length?'':'<button class="ghost xs quick" data-quick="'+stage+'">+ Add ticket</button>'}</div>`}
  function card(t){return`<article class="card ${state.selected===t.id?'selected':''}" draggable="true" data-id="${t.id}" tabindex="0"><div class="card-top"><span class="card-id">${t.id}</span>${t.taken?'<span class="chip taken">● taken</span>':''}${t.blocked?'<span class="chip blocked">blocked</span>':''}${t.pr?`<span class="chip pr">PR #${t.pr}</span>`:''}</div><div class="card-title">${esc(t.title)}</div><div class="card-labels">${t.groups.map(g=>`<span class="chip group" data-group="${g}">${g}</span>`).join('')}${t.labels.slice(0,2).map(l=>`<span class="chip">${esc(l)}</span>`).join('')}</div>${t.assignee?`<div class="card-assignee">${esc(t.assignee)}</div>`:''}</article>`}
  function archiveView(items){return items.length?`<div class="list">${items.map(t=>`<div class="list-row"><button class="linklike list-id" data-open="${t.id}">${t.id}</button><button class="linklike list-title" data-open="${t.id}">${esc(t.title)}</button><span class="chip">${AREAS[t.area]?.[0]}</span><span class="muted">${t.assignee}</span><button class="ghost xs" data-restore="${t.id}">Restore</button></div>`).join('')}</div>`:'<p class="empty">Nothing archived.</p>'}
  function standup(items){const sec=(title,arr)=>arr.length?`<section><h3>${title}</h3><ul>${arr.map(t=>`<li><button class="linklike" data-open="${t.id}">${t.id}</button> — ${esc(t.title)}${t.assignee?' · '+esc(t.assignee):''}</li>`).join('')}</ul></section>`:'';return`<div class="standup"><div style="display:flex;align-items:center;gap:12px"><h2>Standup</h2><button class="ghost sm" id="copy-standup">Copy as Markdown</button></div>${sec('In flight',items.filter(t=>['implementing','review','verifying'].includes(t.status)))}${sec('Blocked',items.filter(t=>t.blocked))}${sec('Up next',items.filter(t=>['backlog','preparing'].includes(t.status)).slice(0,5))}${sec('Recently done',items.filter(t=>t.status==='done').slice(0,4))}</div>`}
  function activity(){return`<aside class="drawer"><div class="drawer-head"><h3 style="margin:0">Activity</h3><div class="spacer"></div><button class="ghost sm" id="close-drawer">Close</button></div><ul class="activity-list">${state.activity.map(a=>`<li><button class="activity-row" data-open="${a[0]}"><span>${a[0]} ${a[1]}</span><span class="activity-meta">${a[2]} · ${a[3]}</span></button></li>`).join('')}</ul></aside>`}
  function bind(){document.querySelectorAll('[data-project]').forEach(e=>e.onclick=x=>{if(x.target.matches('.proj-close'))return toast('Project tabs stay open in the mockup');state.project=e.dataset.project;state.selected=null;state.projects.find(p=>p.id===state.project).unread=0;render()});document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{state.view=e.dataset.view;state.selected=null;render()});$('#new').onclick=()=>openCreate();$('#bell').onclick=()=>{state.activityOpen=!state.activityOpen;state.unread=0;render()};$('#settings').onclick=()=>{state.settingsOpen=true;renderOverlay()};$('#reset').onclick=()=>{state=seed();toast('Demo restored');render()};$('#search')?.addEventListener('input',e=>{state.filters.q=e.target.value;renderKeepFocus('search',e.target.selectionStart)});document.querySelectorAll('[data-filter]').forEach(e=>e.onchange=()=>{state.filters[e.dataset.filter]=e.value;render()});$('#clear')?.addEventListener('click',()=>{state.filters={q:'',area:'',assignee:'',label:'',group:''};render()});document.querySelectorAll('.card').forEach(e=>{e.onclick=x=>{if(x.target.dataset.group){state.filters.group=x.target.dataset.group;render();return}state.selected=e.dataset.id;renderOverlay()};e.oncontextmenu=x=>{x.preventDefault();state.ctx={id:e.dataset.id,x:x.clientX,y:x.clientY};renderOverlay()};e.ondragstart=x=>x.dataTransfer.setData('text/plain',e.dataset.id)});document.querySelectorAll('.cell').forEach(e=>{e.ondragover=x=>{x.preventDefault();e.classList.add('dragover')};e.ondragleave=()=>e.classList.remove('dragover');e.ondrop=x=>{x.preventDefault();move(x.dataTransfer.getData('text/plain'),e.dataset.stage)}});document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{state.selected=e.dataset.open;state.view='board';renderOverlay()});document.querySelectorAll('[data-restore]').forEach(e=>e.onclick=x=>{x.stopPropagation();ticket(e.dataset.restore).archived=false;record(e.dataset.restore,'restored');render()});$('.proj-new').onclick=()=>toast('Two seeded projects are already open');$('#close-drawer')?.addEventListener('click',()=>{state.activityOpen=false;render()});$('#copy-standup')?.addEventListener('click',()=>toast('Standup copied as Markdown'));document.querySelectorAll('.quick').forEach(e=>e.onclick=()=>openCreate(e.dataset.quick))}
  function renderKeepFocus(id,pos){render();const e=$('#'+id);e?.focus();e?.setSelectionRange(pos,pos)}
  function renderOverlay(){const o=$('#overlay');if(state.settingsOpen){o.innerHTML=settings();bindOverlay();return}if(state.paletteOpen){o.innerHTML=palette();bindOverlay();return}if(state.ctx){o.innerHTML=contextMenu();bindOverlay();return}if(state.selected){const t=ticket(state.selected);if(t){o.innerHTML=editor(t);bindOverlay();return}}o.innerHTML=''}
  function editor(t){t.docs??=docs(t.id,1);const names=Object.keys(t.docs);t._doc??='Ticket';const d=t.docs[t._doc]??'';return`<div class="backdrop"><div class="modal wide" role="dialog"><div class="modal-head"><span class="editor-id">${t.id}</span><h2>${esc(t.title)}</h2><div class="spacer"></div><button class="ghost" data-close>×</button></div><div class="modal-body"><div class="editor-tabs">${names.map(n=>`<button class="tab ${t._doc===n?'active':''}" data-doc="${n}">${n}</button>`).join('')}<button class="tab" data-doc="Scratch">Scratch</button></div>${t._doc==='Ticket'?ticketForm(t):docView(t,t._doc,d)}</div><div class="modal-foot"><button class="ghost danger" id="archive">Archive</button><div class="spacer"></div><button class="ghost" data-close>Cancel</button><button class="primary" id="save">Save changes</button></div></div></div>`}
  function ticketForm(t){return`<section class="readiness"><div class="gate"><span class="gate-label">Leaving Preparing</span><span class="req met">✓ plan</span><span class="req met">✓ questions resolved</span></div><div class="gate"><span class="gate-label">Entering Done</span><span class="req ${t.status==='done'?'met':'missing'}">${t.status==='done'?'✓':'○'} proof</span></div></section><div class="field"><span>Title</span><input id="ed-title" value="${esc(t.title)}"></div><div class="field-row"><label class="field"><span>Status</span><select id="ed-status">${STAGES.map(s=>`<option value="${s[0]}" ${s[0]===t.status?'selected':''}>${s[1]}</option>`).join('')}</select></label><label class="field"><span>Area</span><select id="ed-area">${Object.entries(AREAS).map(([id,a])=>`<option value="${id}" ${id===t.area?'selected':''}>${a[0]}</option>`).join('')}</select></label><label class="field"><span>Profile</span><select><option>${t.profile}</option><option>feature</option><option>fix</option><option>chore</option></select></label></div><div class="field-row"><label class="field"><span>Assignee</span><input id="ed-assignee" value="${esc(t.assignee)}"></label><label class="field"><span>Labels</span><input id="ed-labels" value="${esc(t.labels.join(', '))}"></label></div><label class="field"><span>Body · Markdown</span><textarea id="ed-body">${esc(t.body)}</textarea></label>`}
  function docView(t,name,content){if(name==='Checklist'){let i=0;return`<div class="doc-view">${content.split('\n').map(line=>{const m=/^- \[([ x])\] (.*)/.exec(line);if(!m)return esc(line)+'\n';return`<label class="checkitem"><input type="checkbox" data-check="${i++}" ${m[1]==='x'?'checked':''}><span class="${m[1]==='x'?'done':''}">${esc(m[2])}</span></label>`}).join('')}</div>`}return`<textarea id="doc-text">${esc(content)}</textarea>`}
  function settings(){return`<div class="backdrop"><div class="modal wide"><div class="modal-head"><h2>Settings</h2><div class="spacer"></div><button class="ghost" data-close>×</button></div><div class="settings-shell"><nav class="settings-rail">${['Board','Profiles','Appearance','Git','Connect','Dispatch','Remote access','OpenAI tunnel'].map((x,i)=>`<button class="tab ${i===0?'active':''}" data-setting="${x}">${x}</button>`).join('')}</nav><main class="settings-pane" id="settings-pane">${settingsPane('Board')}</main></div></div></div>`}
  function settingsPane(n){if(n==='Board')return`<h2>Board</h2><p class="muted">The workflow uses six fixed stages. Areas colour and group tickets within them.</p><div class="setting-section"><h3>Areas</h3>${Object.entries(AREAS).map(([id,a])=>`<div class="color-row"><input type="color" value="${a[1]}"><input value="${a[0]}"><code>${id}</code></div>`).join('')}<button class="ghost sm">+ Add area</button></div>`;if(n==='Appearance')return`<h2>Appearance</h2><div class="field"><span>Theme</span><div><button class="${state.theme==='dark'?'primary':''}" data-theme-pick="dark">Dark</button> <button class="${state.theme==='light'?'primary':''}" data-theme-pick="light">Light</button></div></div><div class="field"><span>Card density</span><select id="density"><option value="comfortable">Comfortable</option><option value="compact" ${state.density==='compact'?'selected':''}>Compact</option></select></div><label><input style="width:auto" type="checkbox" checked> Desktop notifications</label>`;if(n==='Profiles')return`<h2>Profiles</h2><p class="muted">Profiles resolve the documents required at each workflow boundary.</p>${['feature','fix','chore','spike','capture'].map(x=>`<div class="card" style="margin:6px 0"><strong>${x}</strong><div class="muted">${x==='feature'?'research · files · plan · checklist · report · proof':x==='fix'?'files · plan · report · proof':x==='chore'?'plan · proof':'research or no gates'}</div></div>`).join('')}`;return`<h2>${n}</h2><p class="muted">This seeded control demonstrates the current Settings navigation.</p><div class="setting-section"><h3>Status</h3><div class="card"><strong>${n==='Connect'?'Codex connected':n==='Git'?'Board worktree healthy':'Ready'}</strong><p class="muted">atlas-platform · project identity verified</p><button class="primary sm">Run check</button></div></div>`}
  function palette(){const q=state._palette||'',commands=[['New ticket','new'],['Go to Board','board'],['Go to Standup','standup'],['Open Settings','settings'],...active().slice(0,8).map(t=>[`${t.id} — ${t.title}`,t.id])].filter(x=>x[0].toLowerCase().includes(q.toLowerCase()));return`<div class="backdrop"><div class="modal palette"><input id="palette-input" autofocus placeholder="Type a command or ticket…" value="${esc(q)}"><ul class="palette-list">${commands.map(x=>`<li data-command="${x[1]}">${esc(x[0])}</li>`).join('')}</ul></div></div>`}
  function contextMenu(){const t=ticket(state.ctx.id);return`<div class="backdrop" style="background:transparent" data-close><div class="ctx" style="left:${Math.min(state.ctx.x,innerWidth-220)}px;top:${Math.min(state.ctx.y,innerHeight-300)}px"><button data-ctx="open">Open <span class="kbd">Enter</span></button>${STAGES.map(s=>`<button data-move="${s[0]}">Move to ${s[1]} ${s[0]===t.status?'✓':''}</button>`).join('')}<hr><button data-ctx="copy">Copy ID</button><button data-ctx="wiki">Copy [[wiki-link]]</button><hr><button class="danger" data-ctx="archive">Archive</button></div></div>`}
  function bindOverlay(){document.querySelectorAll('[data-close]').forEach(e=>e.onclick=x=>{if(x.target!==e&&e.classList.contains('backdrop'))return;state.selected=null;state.settingsOpen=false;state.paletteOpen=false;state.ctx=null;renderOverlay()});document.querySelectorAll('[data-doc]').forEach(e=>e.onclick=()=>{ticket(state.selected)._doc=e.dataset.doc;renderOverlay()});document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{const t=ticket(state.selected);let i=-1;t.docs.Checklist=t.docs.Checklist.split('\n').map(l=>/^- \[[ x]\]/.test(l)&&++i===+e.dataset.check?l.replace(/\[[ x]\]/,e.checked?'[x]':'[ ]'):l).join('\n');toast('Checklist updated');renderOverlay()});$('#save')?.addEventListener('click',()=>{const t=ticket(state.selected);if(t._doc==='Ticket'){t.title=$('#ed-title').value;t.status=$('#ed-status').value;t.area=$('#ed-area').value;t.assignee=$('#ed-assignee').value;t.labels=$('#ed-labels').value.split(',').map(x=>x.trim()).filter(Boolean);t.body=$('#ed-body').value}else if($('#doc-text'))t.docs[t._doc]=$('#doc-text').value;record(t.id,'updated');state.selected=null;toast('Changes saved');render()});$('#archive')?.addEventListener('click',()=>{const t=ticket(state.selected);t.archived=true;record(t.id,'archived');state.selected=null;toast('Ticket archived');render()});document.querySelectorAll('[data-setting]').forEach(e=>e.onclick=()=>{$('#settings-pane').innerHTML=settingsPane(e.dataset.setting);document.querySelectorAll('[data-setting]').forEach(x=>x.classList.toggle('active',x===e));bindSettingsPane()});bindSettingsPane();$('#palette-input')?.addEventListener('input',e=>{state._palette=e.target.value;renderOverlay();$('#palette-input').focus()});document.querySelectorAll('[data-command]').forEach(e=>e.onclick=()=>runCommand(e.dataset.command));document.querySelectorAll('[data-move]').forEach(e=>e.onclick=()=>move(state.ctx.id,e.dataset.move));document.querySelector('[data-ctx="open"]')?.addEventListener('click',()=>{state.selected=state.ctx.id;state.ctx=null;renderOverlay()});document.querySelector('[data-ctx="copy"]')?.addEventListener('click',()=>{toast('ID copied');state.ctx=null;renderOverlay()});document.querySelector('[data-ctx="wiki"]')?.addEventListener('click',()=>{toast('Wiki-link copied');state.ctx=null;renderOverlay()});document.querySelector('[data-ctx="archive"]')?.addEventListener('click',()=>{ticket(state.ctx.id).archived=true;state.ctx=null;toast('Ticket archived');render()})}
  function bindSettingsPane(){document.querySelectorAll('[data-theme-pick]').forEach(e=>e.onclick=()=>{state.theme=e.dataset.themePick;document.documentElement.dataset.theme=state.theme;$('#settings-pane').innerHTML=settingsPane('Appearance');bindSettingsPane()});$('#density')?.addEventListener('change',e=>{state.density=e.target.value;toast(`${e.target.value} cards selected`)})}
  function move(id,status){const t=ticket(id);if(!t)return;t.status=status;record(id,`moved to ${STAGES.find(s=>s[0]===status)[1]}`);state.ctx=null;toast(`${id} moved to ${STAGES.find(s=>s[0]===status)[1]}`);render()}
  function openCreate(stage='backlog'){state.selected=null;$('#overlay').innerHTML=`<div class="backdrop"><div class="modal"><div class="modal-head"><h2>New ticket</h2><div class="spacer"></div><button data-close>×</button></div><div class="modal-body"><label class="field"><span>Title</span><input id="new-title" autofocus placeholder="What needs to change?"></label><div class="field-row"><label class="field"><span>Status</span><select id="new-stage">${STAGES.map(s=>`<option value="${s[0]}" ${s[0]===stage?'selected':''}>${s[1]}</option>`).join('')}</select></label><label class="field"><span>Area</span><select id="new-area">${Object.entries(AREAS).map(([id,a])=>`<option value="${id}">${a[0]}</option>`).join('')}</select></label></div><label class="field"><span>Body</span><textarea id="new-body" placeholder="## What\n\nDescribe the outcome…"></textarea></label></div><div class="modal-foot"><div class="spacer"></div><button data-close>Cancel</button><button class="primary" id="create">Create ticket</button></div></div></div>`;document.querySelectorAll('[data-close]').forEach(e=>e.onclick=()=>renderOverlay());$('#create').onclick=()=>{const title=$('#new-title').value.trim();if(!title)return toast('Add a title first');const area=$('#new-area').value,prefix=area==='gui'?'GUI':area.toUpperCase(),num=Math.max(0,...active().filter(t=>t.id.startsWith(prefix)).map(t=>+t.id.split('-')[1]))+1,id=`${prefix}-${String(num).padStart(3,'0')}`;active().push(T(id,title,$('#new-stage').value,area,'you',['new'],null,{body:$('#new-body').value||'## What\n\n'+title}));record(id,'created');toast(`${id} created`);render()}}
  function runCommand(c){state.paletteOpen=false;state._palette='';if(c==='new')return openCreate();if(c==='settings'){state.settingsOpen=true;return renderOverlay()}if(c==='board'||c==='standup'){state.view=c;return render()}state.selected=c;renderOverlay()}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.selected=null;state.settingsOpen=false;state.paletteOpen=false;state.ctx=null;renderOverlay()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.paletteOpen=true;renderOverlay()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openCreate()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();state.view='board';render();$('#search')?.focus()}if(e.ctrlKey&&['1','2','3'].includes(e.key)){state.view=['board','standup','archived'][+e.key-1];render()}});
  render();
})();
</script></body></html>
